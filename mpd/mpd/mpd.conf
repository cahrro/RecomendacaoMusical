# Diretórios básicos
music_directory     "C:/mpd/mpd/music"
playlist_directory  "C:/mpd/mpd/playlists"
db_file             "C:/mpd/mpd/database"
log_file            "C:/mpd/mpd/log"
pid_file            "C:/mpd/pid"
state_file          "C:/mpd/mpd/state"
sticker_file        "C:/mpd/mpd/sticker.sql"

# Porta padrão
port                "6600"

# Permitir acesso local
bind_to_address     "127.0.0.1"

# Configuração de áudio (Windows - WASAPI ou DirectSound)
audio_output {
    type        "wasapi"
    name        "My WASAPI Device"
    mixer_type  "software"
}

# Alternativa (caso WASAPI não funcione)
#audio_output {
#    type        "winmm"
#    name        "My WinMM Device"
#    mixer_type  "software"
#}

# Permitir arquivos comuns
filesystem_charset  "UTF-8"
#id3v1_encoding      "UTF-8"